<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Automation Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        .device-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .device-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 30px;
            width: 180px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .device-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.4);
        }

        .device-card h2 {
            margin: 10px 0;
            font-size: 1.5em;
        }

        .device-card i {
            font-size: 3em;
            margin-bottom: 10px;
            color: #ffd700;
        }

        .device-card .status {
            margin-bottom: 15px;
            font-size: 1em;
            font-weight: bold;
            color: #fff;
        }

        .device-card button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            margin: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: background 0.3s, transform 0.2s;
        }

        .device-card button:hover {
            transform: scale(1.05);
        }

        .on-btn {
            background-color: #28a745;
            color: white;
        }

        .off-btn {
            background-color: #dc3545;
            color: white;
        }

        footer {
            margin-top: 50px;
            font-size: 0.9em;
            color: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body>
    <h1>Home Automation Panel</h1>
    <div class="device-container">
        <!-- Light -->
        <div class="device-card">
            <i class="fas fa-lightbulb"></i>
            <h2>Light</h2>
            <div class="status">{{ status_light }}</div>
            <form method="POST" action="/control">
                <input type="hidden" name="device" value="light">
                <button class="on-btn" name="action" value="on">ON</button>
                <button class="off-btn" name="action" value="off">OFF</button>
            </form>
        </div>

        <!-- Fan -->
        <div class="device-card">
            <i class="fas fa-fan"></i>
            <h2>Fan</h2>
            <div class="status">{{ status_fan }}</div>
            <form method="POST" action="/control">
                <input type="hidden" name="device" value="fan">
                <button class="on-btn" name="action" value="on">ON</button>
                <button class="off-btn" name="action" value="off">OFF</button>
            </form>
        </div>

        <!-- Gate -->
        <div class="device-card">
            <i class="fas fa-door-open"></i>
            <h2>Gate</h2>
            <div class="status">{{ status_gate }}</div>
            <form method="POST" action="/control">
                <input type="hidden" name="device" value="gate">
                <button class="on-btn" name="action" value="open">OPEN</button>
                <button class="off-btn" name="action" value="close">CLOSE</button>
            </form>
        </div>
    </div>

    <footer>
        &copy; 2025 Home Automation System | Designed for Raspberry Pi
    </footer>
</body>
</html>
